<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Chat | Your Name</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .chat-header {
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Setup screen for Username */
        #setup-screen {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        #setup-screen input {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        #setup-screen input:focus {
            border-color: var(--accent-color);
        }

        /* Chat messages area */
        #chat-screen {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .messages-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.visitor {
            background: var(--accent-color);
            color: #0f172a;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.owner {
            background: #334155;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h2>Direct Connection</h2>
            <p>Message me directly. No sign-up required.</p>
        </div>

        <!-- Step 1: Prompt Username -->
        <div id="setup-screen">
            <h3>Who is reaching out?</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Please enter your name or company so I know who I'm talking to.</p>
            <input type="text" id="username-input" placeholder="e.g. Jane Doe (Google Recruiter)" />
            <button onclick="startChat()">Start Chatting</button>
        </div>

        <!-- Step 2: Active Chat Interface -->
        <div id="chat-screen">
            <div class="messages-box" id="messages-box">
                <div class="message owner">Hey there! Send a message below and it will pipe straight to my phone. I'll reply as soon as I can.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION (Replace with your Bot Details from BotFather)
        const BOT_TOKEN = "YOUR_TELEGRAM_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_TELEGRAM_CHAT_ID_HERE";

        let visitorName = "";

        function startChat() {
            const input = document.getElementById("username-input").value.trim();
            if (!input) {
                alert("Please enter a name or identifier.");
                return;
            }
            visitorName = input;
            document.getElementById("setup-screen").style.display = "none";
            document.getElementById("chat-screen").style.display = "flex";
        }

        async function sendMessage() {
            const inputField = document.getElementById("message-input");
            const text = inputField.value.trim();
            if (!text) return;

            // Append visitor message to UI
            appendMessage(text, "visitor");
            inputField.value = "";

            // Format message for Telegram
            const payloadText = `💬 *New Portfolio Message*\n*From:* ${visitorName}\n*Message:* ${text}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: payloadText,
                        parse_mode: "Markdown"
                    })
                });
            } catch (error) {
                console.error("Failed to send message:", error);
            }
        }

        function appendMessage(text, sender) {
            const box = document.getElementById("messages-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
