<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with CyberJay</title>
<style>
:root{--bg:#0b0f14;--card:#121820;--line:#1f2a37;--tx:#e6edf3;--mut:#8b98a7;--ac:#00ff9c;--onac:#04110b;--bub:#1f2a37}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--line:#d8dee4;--tx:#1f2328;--mut:#59636e;--ac:#0a7d4f;--onac:#fff;--bub:#e7ecf0}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.back{max-width:480px;width:100%;margin-bottom:10px;font-size:14px;color:var(--mut);text-decoration:none}
.back:hover{color:var(--ac)}
.box{width:100%;max-width:480px;height:80vh;max-height:640px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ac)}
#login{padding:24px;display:flex;flex-direction:column;gap:12px}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--ac);color:var(--onac)}
.them{align-self:flex-start;background:var(--bub)}
.bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--onac);font-weight:600;cursor:pointer}
#err{font-size:13px;color:#ff7b7b}
</style>
</head>
<body>
<a class="back" id="back" href="/">&larr; Back to main site</a>
<div class="box">
  <header>💬 Chat with CyberJay</header>
  <div id="login">
    <p style="margin:0;font-size:14px">Enter a name to start the conversation.</p>
    <input id="name" maxlength="30" placeholder="Your name / company" style="flex:none">
    <button id="start">Start chat</button>
    <span id="err"></span>
  </div>
  <div id="chat">
    <div id="log"></div>
    <div class="bar">
      <input id="text" maxlength="1000" placeholder="Type a message...">
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
/* ---------- SETTINGS ---------- */
const API = '';          // '' = same domain, or e.g. 'https://your-app.vercel.app'
const MAIN_SITE = '/';   // e.g. 'https://yoursite.com'
const DEMO = true;       // true = fake replies (no backend). Set false when live.
/* ------------------------------- */

const $ = id => document.getElementById(id);
$('back').href = MAIN_SITE;

let store; try { store = window.localStorage; store.getItem('x'); } catch (e) { store = null; }
const get = k => { try { return store && store.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { store && store.setItem(k, v); } catch (e) {} };

const rand = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(16).padStart(2, '0')).join('');
let sid = get('cj_sid'), name = get('cj_name');
let seen = new Set(); try { seen = new Set(JSON.parse(get('cj_seen') || '[]')); } catch (e) {}

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

function openChat() {
  $('login').style.display = 'none';
  $('chat').style.display = 'flex';
  add(`Hi ${name}, send a message and I'll reply here.`, 'them');
  if (!DEMO) { poll(); setInterval(poll, 4000); }
}

$('start').onclick = () => {
  const n = $('name').value.trim();
  if (!n) { $('err').textContent = 'Enter a name first'; return; }
  name = n; sid = sid || rand();
  set('cj_name', name); set('cj_sid', sid);
  openChat();
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('start').click(); });
$('name').addEventListener('input', () => $('err').textContent = '');

async function send() {
  const t = $('text').value.trim();
  if (!t) return;
  $('text').value = '';
  add(t, 'me');
  if (DEMO) { setTimeout(() => add(`Thanks, ${name}. This is a simulated reply.`, 'them'), 1200); return; }
  try {
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid, name, text: t })
    });
    if (!r.ok) throw new Error();
  } catch (e) { add('⚠️ Message failed to send. Try again.', 'them'); }
}
$('send').onclick = send;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function poll() {
  if (document.hidden) return;
  try {
    const r = await fetch(`${API}/api/chat?sid=${sid}`, { cache: 'no-store' });
    const { replies } = await r.json();
    for (const m of replies) {
      if (seen.has(m.id)) continue;
      seen.add(m.id);
      add(m.text, 'them');
    }
    set('cj_seen', JSON.stringify([...seen]));
  } catch (e) {}
}

if (sid && name) openChat();
</script>
</body>
</html>
